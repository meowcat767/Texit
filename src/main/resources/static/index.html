<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texit - Mutt-like Reddit</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="terminal">
        <header id="top-bar">Texit: [Index] - (j:down k:up Enter:view p:post r:refresh q:back)</header>
        <main id="content">
            <div id="list-view">
                <table id="post-table">
                    <thead>
                        <tr>
                            <th class="col-num">#</th>
                            <th class="col-votes">Votes</th>
                            <th class="col-author">Author</th>
                            <th class="col-title">Subject</th>
                        </tr>
                    </thead>
                    <tbody id="post-list">
                        <!-- Posts will be loaded here -->
                    </tbody>
                </table>
            </div>
            <div id="detail-view" style="display: none;">
                <div id="post-header"></div>
                <hr>
                <div id="post-body"></div>
                <hr>
                <div id="comment-section">
                    <h3>Comments:</h3>
                    <div id="comment-list"></div>
                </div>
            </div>
            <div id="compose-view" style="display: none;">
                <h2 id="compose-title">Compose</h2>
                <div class="input-line">Username: <input type="text" id="username-input" class="mutt-input"></div>
                <div id="post-inputs">
                    <div class="input-line">Subject:  <input type="text" id="subject-input" class="mutt-input"></div>
                    <div class="input-line">Body:</div>
                    <textarea id="body-input" class="mutt-input" rows="10"></textarea>
                </div>
                <div id="comment-inputs" style="display: none;">
                    <div class="input-line">Comment:</div>
                    <textarea id="comment-body-input" class="mutt-input" rows="5"></textarea>
                </div>
                <div class="help-line">(Ctrl+S: Submit, Esc: Cancel)</div>
            </div>
        </main>
        <footer id="status-bar">-- Texit: Index [1/1] (100%) --</footer>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
